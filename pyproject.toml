[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abforge"
version = "0.1.0"
description = "A Python package for the full A/B test lifecycle — power analysis, hypothesis testing, sequential testing, and CUPED variance reduction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["ab-testing", "statistics", "experimentation", "hypothesis-testing", "cuped", "sequential-testing"]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.0.0",
    "db-dtypes>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/aditiputtur/abforge"

[tool.setuptools.packages.find]
include = ["abforge*"]